<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 110" width="100%" height="110px" style="background:#0a0d17;border-radius:8px;border:1px solid rgba(0,255,136,0.22);box-shadow:inset 0 0 10px rgba(0,255,255,0.1)">
  <style>
    @keyframes gearRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes pulseCore { 0%, 100% { opacity: 0.8; } 50% { opacity: 1; } }
    @keyframes rhythmOscillate { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
    @keyframes dashflow { from { stroke-dashoffset: 12; } to { stroke-dashoffset: 0; } }
    .core-rotate { animation: gearRotate 15s linear infinite; transform-origin: 40px 35px; }
    .core-pulse { animation: pulseCore 2.5s infinite ease-in-out; transform-origin: 40px 35px; }
    .synapse-dash { animation: dashflow 1.5s linear infinite; }
    .rhythm-float { animation: rhythmOscillate 2s infinite ease-in-out; }
  </style>
  <rect x="0" y="0" width="320" height="15" fill="#001a08"/>
  <text x="160" y="10.5" fill="rgba(255,255,255,0.4)" font-size="6" font-family="monospace" text-anchor="middle">ARES_OS // NEURODIVERSITY_CORE_OVERVIEW</text>
  <g opacity="0.12">
    <line x1="0" y1="40" x2="320" y2="40" stroke="#00ff88" stroke-width="0.5"/>
    <line x1="160" y1="15" x2="160" y2="110" stroke="#00ff88" stroke-width="0.5"/>
  </g>
  <g transform="translate(15, 20)">
    <g class="core-rotate">
      <circle cx="40" cy="35" r="20" fill="none" stroke="#00ff88" stroke-width="1.2" stroke-dasharray="4 2"/>
    </g>
    <g class="core-pulse">
      <circle cx="40" cy="35" r="12" fill="none" stroke="#00f0ff" stroke-width="0.8"/>
      <circle cx="40" cy="35" r="4" fill="#00ff88" filter="drop-shadow(0 0 3px #00ff88)"/>
    </g>
    <text x="40" y="65" fill="rgba(255,255,255,0.6)" font-size="5.5" font-family="monospace" text-anchor="middle">AUTISTIC CORE</text>
  </g>
  <g transform="translate(110, 45)">
    <path d="M 10,0 Q 50,-10 90,0" fill="none" stroke="rgba(0,255,136,0.3)" stroke-width="1" stroke-dasharray="6 3" class="synapse-dash"/>
    <text x="50" y="4" fill="#00ff88" font-size="5" font-family="monospace" text-anchor="middle" font-weight="bold">SYNAPSE</text>
  </g>
  <g transform="translate(210, 20)">
    <g class="rhythm-float">
      <path d="M 10,55 Q 30,20 50,55" fill="none" stroke="#00f0ff" stroke-width="1.5"/>
      <path d="M 20,55 Q 40,10 60,55" fill="none" stroke="#00ff88" stroke-width="1" stroke-dasharray="2 1" opacity="0.6" class="synapse-dash"/>
    </g>
    <text x="35" y="68" fill="rgba(255,255,255,0.6)" font-size="5.5" font-family="monospace" text-anchor="middle">ADHD RHYTHM</text>
  </g>
  <text x="10" y="102" fill="rgba(255,255,255,0.4)" font-size="5.5" font-family="monospace" text-anchor="start">MODEL: neurodiversity_core_v1.0</text>
  <text x="310" y="102" fill="#00ff88" font-size="5.5" font-family="monospace" text-anchor="end">INTEGRATION: ACTIVE</text>
</svg>
