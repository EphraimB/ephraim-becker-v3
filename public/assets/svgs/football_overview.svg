<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 110" width="100%" height="110px" style="background:#0a0d17;border-radius:8px;border:1px solid rgba(255,87,34,0.22);box-shadow:inset 0 0 10px rgba(0,0,0,0.4)">
  <style>
    @keyframes arrowDash { from { stroke-dashoffset: 12; } to { stroke-dashoffset: 0; } }
    @keyframes teamPulse { 0%, 100% { transform: scale(0.98); opacity: 0.8; } 50% { transform: scale(1.02); opacity: 1; } }
    @keyframes shakePlay { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(0.5px, 0.5px); } }
    .play-arrow { animation: arrowDash 0.8s linear infinite; }
    .team-node { animation: teamPulse 2.5s infinite ease-in-out; }
    .playbook-vibrate { animation: shakePlay 0.15s infinite ease-in-out; }
  </style>
  <rect x="0" y="0" width="320" height="15" fill="#1b100a"/>
  <text x="160" y="10.5" fill="rgba(255,255,255,0.4)" font-size="6" font-family="monospace" text-anchor="middle">ARES_OS // PLAYBOOK_INCLUSION_CORE</text>
  <g transform="translate(15, 20)">
    <g class="playbook-vibrate">
      <circle cx="20" cy="40" r="7" fill="none" stroke="#ff5722" stroke-width="1"/>
      <text x="20" y="43" fill="#ff5722" font-size="8" font-family="monospace" text-anchor="middle">Q</text>
      <circle cx="45" cy="40" r="3" fill="#00f0ff"/>
      <circle cx="70" cy="40" r="3" fill="#00f0ff"/>
      <path d="M 45,40 Q 55,15 75,15" fill="none" stroke="#ff5722" stroke-width="1.2" stroke-dasharray="4 2" class="play-arrow"/>
      <polygon points="75,12 72,17 78,17" fill="#ff5722"/>
    </g>
    <text x="45" y="58" fill="rgba(255,255,255,0.5)" font-size="5.5" font-family="monospace" text-anchor="middle">TACTICAL MATRIX</text>
  </g>
  <g>
    <path d="M 100,50 C 135,30 185,70 220,50" fill="none" stroke="#ff5722" stroke-width="1.2" stroke-dasharray="6 4" class="play-arrow"/>
    <text x="160" y="46" fill="#fff" font-size="5.5" font-family="monospace" text-anchor="middle" opacity="0.75">INCLUSION DELTA LINK</text>
    <rect x="125" y="52" width="70" height="8" rx="2" fill="rgba(255,87,34,0.08)" stroke="rgba(255,87,34,0.3)" stroke-width="0.5"/>
    <text x="160" y="58" fill="#ff5722" font-size="4.5" font-family="monospace" text-anchor="middle" font-weight="bold">ROLE VALUE: 100%</text>
  </g>
  <g transform="translate(210, 20)">
    <g class="team-node" style="transform-origin: 50px 30px;">
      <circle cx="50" cy="30" r="4.5" fill="#ff5722" stroke="#fff" stroke-width="0.8"/>
      <circle cx="30" cy="15" r="3" fill="#00f0ff"/>
      <circle cx="70" cy="15" r="3" fill="#00f0ff"/>
      <circle cx="30" cy="45" r="3" fill="#00f0ff"/>
      <circle cx="70" cy="45" r="3" fill="#00f0ff"/>
      <line x1="50" y1="30" x2="30" y2="15" stroke="rgba(255,255,255,0.2)" stroke-width="0.8"/>
      <line x1="50" y1="30" x2="70" y2="15" stroke="rgba(255,255,255,0.2)" stroke-width="0.8"/>
      <line x1="50" y1="30" x2="30" y2="45" stroke="rgba(255,255,255,0.2)" stroke-width="0.8"/>
      <line x1="50" y1="30" x2="70" y2="45" stroke="rgba(255,255,255,0.2)" stroke-width="0.8"/>
    </g>
    <text x="50" y="60" fill="rgba(255,255,255,0.6)" font-size="5.5" font-family="monospace" text-anchor="middle">TEAM DYNAMICS</text>
  </g>
  <text x="10" y="102" fill="rgba(255,255,255,0.4)" font-size="5.5" font-family="monospace" text-anchor="start">SYSTEM: playbook_sync_v1.0</text>
  <text x="310" y="102" fill="#ff5722" font-size="5.5" font-family="monospace" text-anchor="end">INCLUSION: MAXIMIZED</text>
</svg>
