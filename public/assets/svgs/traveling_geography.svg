<svg width="1000" height="200" viewBox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="200" fill="#0b0b10"/>
  
  <!-- Header -->
  <rect x="275" y="10" width="450" height="30" fill="#200512"/>
  <text x="500" y="32" font-family="monospace" font-size="12" fill="#888888" text-anchor="middle" letter-spacing="1">ARES_OS // GEOGRAPHIC_SURVEY_DECK</text>

  <!-- Topographic Scanner Graphic -->
  <path d="M 290 100 Q 320 80 350 100 T 410 100" fill="none" stroke="#d3307b" stroke-width="1.5"/>
  <path d="M 290 120 Q 320 100 350 120 T 410 120" fill="none" stroke="#d3307b" stroke-width="1.5"/>
  <path d="M 290 140 Q 320 120 350 140 T 410 140" fill="none" stroke="#d3307b" stroke-width="1.5"/>
  <text x="350" y="165" font-family="monospace" font-size="10" fill="#888888" text-anchor="middle">TOPOGRAPHIC SCANNER</text>

  <!-- Compass -->
  <g stroke="#d3307b" fill="none" stroke-width="1">
    <circle cx="450" cy="115" r="25"/>
    <line x1="450" y1="90" x2="450" y2="140"/>
    <line x1="425" y1="115" x2="475" y2="115"/>
    <polygon points="450,95 455,110 445,110" fill="#d3307b"/>
    <text x="450" y="85" font-family="monospace" font-size="10" fill="#d3307b" text-anchor="middle">N</text>
  </g>

  <!-- Status Panel -->
  <rect x="530" y="60" width="280" height="100" rx="6" ry="6" fill="none" stroke="#d3307b" stroke-width="1"/>
  <text x="550" y="85" font-family="monospace" font-size="12" fill="#d3307b">EXPLORATION: ACTIVE</text>
  <text x="550" y="105" font-family="monospace" font-size="12" fill="white">GEOGRAPHY SCAN: ON</text>
  <text x="550" y="125" font-family="monospace" font-size="12" fill="#888888">CULTURAL PROFILE: READY</text>
  <text x="550" y="145" font-family="monospace" font-size="12" fill="#00d59d">BUDGET RATIO: ASPIRATIONAL</text>

  <!-- Footer Info -->
  <text x="290" y="185" font-family="monospace" font-size="10" fill="#d3307b">SECTOR: BEYOND_NYC_METRO</text>
  <text x="710" y="185" font-family="monospace" font-size="10" fill="#d3307b">TERRAIN_SURVEY: 100%</text>
</svg>
