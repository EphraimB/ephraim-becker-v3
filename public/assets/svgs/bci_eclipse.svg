<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- HUD Circular reticles (Static background one) -->
  <circle cx="50" cy="50" r="36" stroke="rgba(255, 179, 0, 0.15)" stroke-width="1" fill="none" />

  <!-- Rotating reticle 1 (Outer blue dashed circle, rotating clockwise) -->
  <g transform="translate(50, 50)">
    <g>
      <circle cx="0" cy="0" r="29" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5" stroke-dasharray="6,4" fill="none" />
      <animateTransform 
        attributeName="transform" 
        type="rotate" 
        from="0" 
        to="360" 
        dur="15s" 
        repeatCount="indefinite" 
      />
    </g>
  </g>
  
  <!-- Rotating reticle 2 (Inner amber dashed circle, rotating counter-clockwise) -->
  <g transform="translate(50, 50)">
    <g>
      <circle cx="0" cy="0" r="22" stroke="#ffb300" stroke-width="0.8" stroke-dasharray="4,12" fill="none" />
      <animateTransform 
        attributeName="transform" 
        type="rotate" 
        from="360" 
        to="0" 
        dur="10s" 
        repeatCount="indefinite" 
      />
    </g>
  </g>

  <!-- Diagnostics crosshair alignment -->
  <line x1="50" y1="8" x2="50" y2="20" stroke="#ffb300" stroke-width="1" />
  <line x1="50" y1="80" x2="50" y2="92" stroke="#ffb300" stroke-width="1" />
  <line x1="8" y1="50" x2="20" y2="50" stroke="#ffb300" stroke-width="1" />
  <line x1="80" y1="50" x2="92" y2="50" stroke="#ffb300" stroke-width="1" />

  <!-- Dynamic HUD corners -->
  <path d="M 28 32 L 28 27 L 33 27" fill="none" stroke="#00ff88" stroke-width="1.2" />
  <path d="M 72 32 L 72 27 L 67 27" fill="none" stroke="#00ff88" stroke-width="1.2" />
  <path d="M 28 68 L 28 73 L 33 73" fill="none" stroke="#00ff88" stroke-width="1.2" />
  <path d="M 72 68 L 72 73 L 67 73" fill="none" stroke="#00ff88" stroke-width="1.2" />

  <!-- Center focus indicator -->
  <circle cx="50" cy="50" r="2.5" fill="#ffffff">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite" />
  </circle>

  <!-- Simulated bio-data streams scrolling overlay -->
  <g fill="#00f0ff" opacity="0.7" font-size="3.2" font-family="monospace" font-weight="bold">
    <text x="56" y="38">SYS_UP: 99.8%</text>
    <text x="56" y="44">CORTEX: READY</text>
    <text x="56" y="50">BCI_LINK: EST</text>
    <text x="56" y="56">PING: 0.12ms</text>
  </g>
  
  <g fill="#ffb300" opacity="0.7" font-size="3.2" font-family="monospace" font-weight="bold">
    <text x="22" y="38">MY50</text>
    <text x="21" y="44">SEC_B</text>
    <text x="22" y="50">ECLIPSE</text>
  </g>

  <!-- Horizon display grid -->
  <path d="M 12 50 C 35 48, 65 48, 88 50" fill="none" stroke="rgba(0, 240, 255, 0.2)" stroke-width="0.8" />
</svg>
