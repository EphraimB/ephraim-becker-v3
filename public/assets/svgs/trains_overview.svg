<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 110" width="100%" height="110px" style="background:#080b13;border-radius:8px;border:1px solid rgba(0,210,255,0.22);box-shadow:inset 0 0 10px rgba(0,210,255,0.1)">
  <style>
    @keyframes railDashing { from { stroke-dashoffset: 40; } to { stroke-dashoffset: 0; } }
    @keyframes trainVibrate { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-0.8px); } }
    .rail-line { animation: railDashing 1.5s linear infinite; }
    .sleek-train { animation: trainVibrate 0.15s ease-in-out infinite; }
  </style>
  <rect x="0" y="0" width="320" height="15" fill="#101524"/>
  <text x="160" y="10.5" fill="rgba(255,255,255,0.4)" font-size="6" font-family="monospace" text-anchor="middle">ARES_OS // RAIL_TRANSIT_OVERVIEW</text>
  <g transform="translate(10, 78)">
    <line x1="0" y1="0" x2="300" y2="0" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <line x1="0" y1="4" x2="300" y2="4" stroke="#00d2ff" stroke-width="1.2" stroke-dasharray="15 8" class="rail-line"/>
    <line x1="0" y1="8" x2="300" y2="8" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  </g>
  <g transform="translate(60, 43)">
    <g class="sleek-train">
      <rect x="0" y="38" width="180" height="3" fill="#00d2ff" opacity="0.3" rx="1.5" style="filter:blur(2px)"/>
      <path d="M 0,25 Q 20,5 50,5 L 180,5 L 180,38 L 5,38 Z" fill="#141c2e" stroke="#00d2ff" stroke-width="1.5"/>
      <path d="M 2,28 Q 20,12 40,25" fill="none" stroke="#ffe082" stroke-width="1.5"/>
      <path d="M 12,38 L 40,38 Q 30,30 25,38 Z" fill="#ffe082"/>
      <rect x="52" y="10" width="22" height="10" rx="2" fill="#080b13" stroke="rgba(0,210,255,0.4)" stroke-width="0.8"/>
      <rect x="80" y="10" width="22" height="10" rx="2" fill="#080b13" stroke="rgba(0,210,255,0.4)" stroke-width="0.8"/>
      <rect x="108" y="10" width="22" height="10" rx="2" fill="#080b13" stroke="rgba(0,210,255,0.4)" stroke-width="0.8"/>
      <rect x="136" y="10" width="22" height="10" rx="2" fill="#080b13" stroke="rgba(0,210,255,0.4)" stroke-width="0.8"/>
      <line x1="180" y1="8" x2="180" y2="35" stroke="#ffe082" stroke-width="2"/>
    </g>
  </g>
  <text x="15" y="101" fill="rgba(255,255,255,0.4)" font-size="5.5" font-family="monospace">PROPULSION: AC_INDUCTION // ACTIVE</text>
  <text x="305" y="101" fill="#00d2ff" font-size="5.5" font-family="monospace" text-anchor="end">SYSTEMS: ALL_NOMINAL</text>
</svg>
