<svg xmlns="http://www.w3.org/2000/svg" id="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
  <style>
    @keyframes galaxySpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .galaxy-group {
      animation: galaxySpin 12s linear infinite;
      transform-origin: 12px 12px;
    }
  </style>
  <g class="galaxy-group">
    <circle cx="12" cy="12" r="3" fill="currentColor" />
    <path d="M12 3a9 9 0 0 1 9 9" stroke-dasharray="3 1" />
    <path d="M12 21a9 9 0 0 1-9-9" stroke-dasharray="3 1" />
    <circle cx="21" cy="12" r="1.5" fill="currentColor" />
    <circle cx="3" cy="12" r="1.5" fill="currentColor" />
    <circle cx="12" cy="3" r="1" fill="#fff" />
    <circle cx="12" cy="21" r="1" fill="#fff" />
  </g>
</svg>
