<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 110" width="100%" height="110px" style="background:#080b13;border-radius:8px;border:1px solid rgba(0,210,255,0.22);box-shadow:inset 0 0 10px rgba(0,210,255,0.1)">
  <style>
    @keyframes routePulse { 0%, 100% { stroke-dashoffset: 0; } 50% { stroke-dashoffset: -20; } }
    @keyframes sweepNode { 0% { stroke-dashoffset: 140; } 100% { stroke-dashoffset: 0; } }
    .route-line { animation: routePulse 4s linear infinite; }
    .sweep-dot { animation: sweepNode 6s linear infinite; }
  </style>
  <rect x="0" y="0" width="320" height="15" fill="#101524"/>
  <text x="160" y="10.5" fill="rgba(255,255,255,0.4)" font-size="6" font-family="monospace" text-anchor="middle">AMTRAK // EAST_COAST_ROUTE_MAP</text>
  <g opacity="0.1" stroke="#00d2ff" stroke-width="0.5">
    <line x1="20" y1="20" x2="20" y2="100"/>
    <line x1="60" y1="20" x2="60" y2="100"/>
    <line x1="100" y1="20" x2="100" y2="100"/>
    <line x1="140" y1="20" x2="140" y2="100"/>
    <line x1="180" y1="20" x2="180" y2="100"/>
    <line x1="40" y1="20" x2="310" y2="20"/>
    <line x1="40" y1="50" x2="310" y2="50"/>
    <line x1="40" y1="80" x2="310" y2="80"/>
  </g>
  <path d="M 125,25 Q 110,40 100,50 T 80,75 T 70,100" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <path d="M 125,25 Q 110,40 100,50 T 80,75 T 70,100" fill="none" stroke="#00d2ff" stroke-width="2" stroke-dasharray="6 3" class="route-line"/>
  <path d="M 125,25 Q 110,40 100,50 T 80,75 T 70,100" fill="none" stroke="#ff5722" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="4 140" class="sweep-dot"/>
  <g transform="translate(125, 25)">
    <circle cx="0" cy="0" r="3" fill="#ffe082" stroke="#fff" stroke-width="0.6" filter="drop-shadow(0 0 2px #ffe082)"/>
    <text x="6" y="2" fill="#ffe082" font-size="5.5" font-family="monospace" font-weight="bold">NY PENN</text>
  </g>
  <g transform="translate(70, 98)">
    <circle cx="0" cy="0" r="3" fill="#ffe082" stroke="#fff" stroke-width="0.6" filter="drop-shadow(0 0 2px #ffe082)"/>
    <text x="6" y="1" fill="#ffe082" font-size="5.5" font-family="monospace" font-weight="bold">DEERFIELD BEACH, FL</text>
  </g>
  <g transform="translate(180, 24)">
    <rect x="0" y="0" width="130" height="52" rx="4" fill="rgba(0,0,0,0.75)" stroke="rgba(0,210,255,0.25)" stroke-width="1"/>
    <text x="10" y="11" fill="#00d2ff" font-size="6.5" font-family="monospace" font-weight="bold">AMTRAK: SILVER METEOR</text>
    <text x="10" y="22" fill="#fff" font-size="5.5" font-family="monospace">ROUTE: 1,389 MILES</text>
    <text x="10" y="32" fill="rgba(255,255,255,0.7)" font-size="5" font-family="monospace">JOURNEY OVER FLIGHT: 100%</text>
    <text x="10" y="43" fill="#ff5722" font-size="5.5" font-family="monospace" font-weight="bold">FUN VALUE: ABSOLUTE MAX</text>
  </g>
  <text x="15" y="99" fill="rgba(255,255,255,0.4)" font-size="5.5" font-family="monospace">TRANSPORT: LONG_DISTANCE_RAIL</text>
  <text x="305" y="99" fill="#00d2ff" font-size="5.5" font-family="monospace" text-anchor="end">DESTINATION: DEERFIELD BEACH</text>
</svg>
