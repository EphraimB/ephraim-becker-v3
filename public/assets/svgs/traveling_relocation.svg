<svg width="1000" height="200" viewBox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="200" fill="#0b0b10"/>
  
  <!-- Header -->
  <rect x="275" y="10" width="450" height="30" fill="#200512"/>
  <text x="500" y="32" font-family="monospace" font-size="12" fill="#888888" text-anchor="middle" letter-spacing="1">ARES_OS // COLONY_RELOCATION_GRID</text>

  <!-- NYC Node -->
  <circle cx="330" cy="115" r="25" fill="none" stroke="#d3307b" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="330" cy="115" r="10" fill="#d3307b"/>
  <text x="330" y="160" font-family="monospace" font-size="10" fill="#d3307b" text-anchor="middle">NYC: CONGESTED</text>

  <!-- Transition Arrow -->
  <path d="M 360 105 Q 410 70 460 105" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="460,105 450,115 455,100" fill="#ffffff"/>
  <text x="410" y="70" font-family="monospace" font-size="10" fill="#ffffff" text-anchor="middle">TRANSITION</text>

  <!-- Outpost Node -->
  <circle cx="510" cy="115" r="25" fill="none" stroke="#00d59d" stroke-width="2"/>
  <circle cx="510" cy="115" r="8" fill="#00d59d"/>
  <text x="510" y="160" font-family="monospace" font-size="10" fill="#00d59d" text-anchor="middle">OUTPOST: PEACEFUL</text>

  <!-- Status Panel -->
  <rect x="580" y="60" width="280" height="100" rx="6" ry="6" fill="none" stroke="#d3307b" stroke-width="1"/>
  <text x="600" y="85" font-family="monospace" font-size="12" fill="#d3307b">GOAL: RELOCATION</text>
  <text x="600" y="105" font-family="monospace" font-size="12" fill="white">POST-GRAD TARGET</text>
  <text x="600" y="125" font-family="monospace" font-size="12" fill="#888888">CONGESTION: MINIMAL</text>
  <text x="600" y="145" font-family="monospace" font-size="12" fill="#00d59d">JOBS LINK: ON GRAD</text>

  <!-- Footer Info -->
  <text x="280" y="185" font-family="monospace" font-size="10" fill="#888888">TRAJECTORY: OUTWARD_BOUND</text>
  <text x="720" y="185" font-family="monospace" font-size="10" fill="#00d59d">DENSITY RATIO: LOW</text>
</svg>
